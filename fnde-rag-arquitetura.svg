<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Diagrama animado da arquitetura do assistente RAG: pergunta, roteamento, respostas curadas, busca vetorial hibrida, geracao com LLM e resposta.">
  <style>
    .box { opacity: 0; transform: translateY(14px); animation: enter .6s ease forwards; }
    .b1 { animation-delay: .05s } .b2 { animation-delay: .18s } .b3 { animation-delay: .31s }
    .b4 { animation-delay: .44s } .b5 { animation-delay: .57s } .b6 { animation-delay: .70s }
    @keyframes enter { to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: flow 3.4s ease-in-out infinite; }
    @keyframes flow {
      0% { transform: translateY(0); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateY(408px); opacity: 0; }
    }
    .glow { animation: glow 2.6s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .fade { opacity: 0; animation: enter .8s ease .9s forwards; }
  </style>

  <rect width="1200" height="760" fill="#1b1815"/>
  <text x="60" y="64" fill="#ece6dc" font-size="30" font-weight="700">Assistente RAG — atendimento ao cidadão (FNDE)</text>
  <text x="60" y="92" fill="#b6ab9b" font-size="18">Arquitetura de alto nível · sem dados internos</text>

  <g class="box b1">
    <rect x="150" y="125" width="900" height="74" rx="14" fill="#2a2521" stroke="#3c352d" stroke-width="1.2"/>
    <text x="172" y="159" fill="#cdb389" font-size="20" font-weight="700">1</text>
    <text x="220" y="159" fill="#ece6dc" font-size="21" font-weight="700">Pergunta do cidadão</text>
    <text x="220" y="183" fill="#b6ab9b" font-size="16">Linguagem natural · interface Streamlit</text>
  </g>
  <g class="box b2">
    <rect x="150" y="219" width="900" height="74" rx="14" fill="#2a2521" stroke="#3c352d" stroke-width="1.2"/>
    <text x="172" y="253" fill="#cdb389" font-size="20" font-weight="700">2</text>
    <text x="220" y="253" fill="#ece6dc" font-size="21" font-weight="700">Roteamento automático</text>
    <text x="220" y="277" fill="#b6ab9b" font-size="16">Encaminhamento para a área responsável correta</text>
  </g>
  <g class="box b3">
    <rect x="150" y="313" width="900" height="74" rx="14" fill="#2a2521" stroke="#cdb389" stroke-width="2.5" class="glow"/>
    <rect x="150" y="313" width="900" height="74" rx="14" fill="none" stroke="#cdb389" stroke-width="1"/>
    <text x="172" y="347" fill="#cdb389" font-size="20" font-weight="700">3</text>
    <text x="220" y="347" fill="#ece6dc" font-size="21" font-weight="700">Camada de respostas curadas</text>
    <text x="220" y="371" fill="#b6ab9b" font-size="16">Anti-alucinação em valores, legislação e prazos (pattern matching)</text>
  </g>
  <g class="box b4">
    <rect x="150" y="407" width="900" height="74" rx="14" fill="#2a2521" stroke="#3c352d" stroke-width="1.2"/>
    <text x="172" y="441" fill="#cdb389" font-size="20" font-weight="700">4</text>
    <text x="220" y="441" fill="#ece6dc" font-size="21" font-weight="700">Busca vetorial híbrida</text>
    <text x="220" y="465" fill="#b6ab9b" font-size="16">Embeddings BGE-large · densa + esparsa</text>
  </g>
  <g class="box b5">
    <rect x="150" y="501" width="900" height="74" rx="14" fill="#2a2521" stroke="#3c352d" stroke-width="1.2"/>
    <text x="172" y="535" fill="#cdb389" font-size="20" font-weight="700">5</text>
    <text x="220" y="535" fill="#ece6dc" font-size="21" font-weight="700">Geração com LLM + resiliência</text>
    <text x="220" y="559" fill="#b6ab9b" font-size="16">Llama 4 Maverick → fallback Claude Sonnet 4 · circuit breaker</text>
  </g>
  <g class="box b6">
    <rect x="150" y="595" width="900" height="74" rx="14" fill="#2a2521" stroke="#3c352d" stroke-width="1.2"/>
    <text x="172" y="629" fill="#cdb389" font-size="20" font-weight="700">6</text>
    <text x="220" y="629" fill="#ece6dc" font-size="21" font-weight="700">Resposta + confidence scoring</text>
    <text x="220" y="653" fill="#b6ab9b" font-size="16">Classificação de confiança alta / média / baixa</text>
  </g>

  <circle class="pulse" cx="600" cy="199" r="6" fill="#cdb389"/>

  <g class="fade">
    <rect x="60" y="695" width="1080" height="44" rx="12" fill="#221e1a" stroke="#3c352d" stroke-width="1.2"/>
    <text x="82" y="722" fill="#cdb389" font-size="15" font-weight="700">Transversal</text>
    <text x="180" y="722" fill="#b6ab9b" font-size="15">Observabilidade e telemetria · Painel de curadoria · Databricks (Unity Catalog · Delta Lake · Vector Search · SQL Warehouse)</text>
  </g>
</svg>
